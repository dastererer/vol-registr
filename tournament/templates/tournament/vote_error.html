{% extends 'base.html' %}
{% load static %}
{% block title %}Vote Error | Pocket Aces Court Cup 3{% endblock %}
{% block content %}
<section class="event-result event-result--error">
  <div class="event-result__ghost" aria-hidden="true">REPLAY</div>
  <article class="event-result__card" data-aos="zoom-in">
    <canvas
      class="motion-canvas event-result__motion"
      width="160"
      height="160"
      data-lottie-src="{% static 'assets/motion/error.json' %}"
      data-lottie-loop="false"
    ></canvas>
    <div>
      <p class="section-kicker">// VOTE NOT COUNTED</p>
      <h1>Check the link.</h1>
      <p>{{ error }}</p>
      <a href="{% url 'index' %}#registeredTeamsModal" class="btn btn-outline">Choose a team</a>
    </div>
  </article>
</section>
{% endblock %}
