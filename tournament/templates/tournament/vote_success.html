{% extends 'base.html' %}
{% load static %}
{% block title %}Vote Confirmed | Pocket Aces Court Cup 3{% endblock %}
{% block content %}
<section class="event-result event-result--success">
  <div class="event-result__ghost" aria-hidden="true">COUNTED</div>
  <article class="event-result__card" data-aos="zoom-in">
    <canvas
      class="motion-canvas event-result__motion"
      width="160"
      height="160"
      data-lottie-src="{% static 'assets/motion/success.json' %}"
      data-lottie-loop="false"
    ></canvas>
    <div>
      <p class="section-kicker">// VOTE VERIFIED</p>
      <h1>Vote counted.</h1>
      <p>Your support for <strong>{{ team.name }}</strong> is now part of the fan ranking.</p>
      <a href="{% url 'tournament_team' team.id %}" class="btn btn-cta">Back to team</a>
    </div>
  </article>
</section>
{% endblock %}
