{% extends 'base.html' %}
{% load static %}
{% block title %}Vote Confirmed | Pocket Aces Court Cup 3{% endblock %}
{% block extra_head %}
<style>
  .vote-result-container {
    display: grid;
    min-height: calc(100svh - var(--nav-h));
    padding: var(--section-y) var(--gutter);
    place-items: center;
  }

  .vote-result-card {
    background: var(--ink-2);
    border: 2px solid var(--paper);
    clip-path: var(--card-clip);
    max-width: 42rem;
    padding: clamp(1.75rem, 5vw, 4rem);
    position: relative;
    text-align: left;
    width: 100%;
  }

  .vote-result-kicker {
    color: var(--volt);
    font: 700 var(--fs-mono-sm)/1 var(--font-mono);
    letter-spacing: 0.14em;
    margin: 0 0 1rem;
    text-transform: uppercase;
  }

  .vote-result-icon-success {
    color: var(--ok);
    font-size: clamp(2.5rem, 7vw, 4rem);
    margin-bottom: 1.25rem;
  }

  .vote-result-title {
    color: var(--paper);
    font: italic 800 var(--fs-display-lg)/0.88 var(--font-display);
    margin: 0 0 1.25rem;
    text-transform: uppercase;
  }

  .vote-result-text {
    color: var(--muted);
    font: 400 var(--fs-body)/1.65 var(--font-body);
    margin: 0 0 2rem;
  }

  .vote-result-text strong {
    color: var(--paper);
  }
</style>
{% endblock %}
{% block content %}
<section class="vote-result-container">
  <div class="vote-result-card" data-reveal>
    <p class="vote-result-kicker">// Vote status</p>
    <i class="fas fa-check-circle vote-result-icon-success" aria-hidden="true"></i>
    <h1 class="vote-result-title">Vote Confirmed!</h1>
    <p class="vote-result-text">Your vote for <strong>{{ team.name }}</strong> has been verified.</p>
    <a href="{% url 'index' %}" class="btn btn-primary vote-result-btn">Back to Homepage</a>
  </div>
</section>
{% endblock %}
